name: Publish Rivet
on:
  workflow_run:
    workflows: ['Build and test']
    types: [completed]
permissions:
  contents: read
jobs:
  publish:
    # Never execute code or consume artifacts from PRs or untrusted branches.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    concurrency:
      group: rivet-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact-commit release gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh run download "$RUN_ID" --name release-intent --dir release-gate
          python3 - <<'PYGATE'
          import json, os
          from pathlib import Path
          intent = json.loads(Path('release-gate/release-intent.json').read_text())
          if intent['commit'] != os.environ['COMMIT']:
              raise SystemExit('Release gate belongs to a different commit')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('publish=' + str(intent['publish'] is True).lower() + '\n')
          PYGATE
      - name: Download tested Linux bundle
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run download "$RUN_ID" --name rivet-ubuntu-latest --dir tested
      - name: Configure mirror push authentication
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git
      - name: Package and publish new version
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RIVET_RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
          RIVET_UPDATE_SIGNING_KEY: ${{ secrets.RIVET_UPDATE_SIGNING_KEY }}
        run: python rivet/tooling/release.py --artifact tested --publish --signed-updates
      - name: Refresh documentation and update mirror
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --ref main
