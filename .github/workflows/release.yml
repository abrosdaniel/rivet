name: Publish Rivet
on:
  workflow_call:
    secrets:
      RIVET_UPDATE_SIGNING_KEY:
        required: true
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    concurrency:
      group: rivet-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download tested Linux bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --name rivet-ubuntu-latest --dir tested
      - name: Configure mirror push authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git
      - name: Package and publish new version
        env:
          GH_TOKEN: ${{ github.token }}
          RIVET_UPDATE_SIGNING_KEY: ${{ secrets.RIVET_UPDATE_SIGNING_KEY }}
        run: python rivet/tooling/release.py --artifact tested --publish --signed-updates
      - name: Refresh documentation and update mirror
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --ref main
