name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run the complete platform, database and Minecraft checks
        type: boolean
        default: true
concurrency:
  group: rivet-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.select.outputs.full }}
      publish: ${{ steps.select.outputs.publish }}
      platforms: ${{ steps.select.outputs.platforms }}
      postgres: ${{ steps.select.outputs.postgres }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FULL: ${{ github.event_name != 'workflow_dispatch' || inputs.full }}
        run: python3 rivet/tooling/ci_plan.py --event "$EVENT" --ref "$REF" --default-branch "$DEFAULT_BRANCH" --full "$FULL" >> "$GITHUB_OUTPUT"
  java:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.platforms) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew build --no-daemon
        shell: bash
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rivet-${{ matrix.os }}
          path: |
            rivet/mod/build/libs/*.jar
            rivet/core/build/reports/tests/
            rivet/helper/build/reports/tests/
            rivet/helper/build/test-results/
            rivet/bootstrap/build/reports/tests/
  postgres:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.plan.outputs.postgres) }}
    runs-on: ubuntu-latest
    services:
      database:
        image: postgres:${{ matrix.version }}
        env:
          POSTGRES_USER: rivet_test
          POSTGRES_PASSWORD: rivet_ci_test_only
          POSTGRES_DB: rivet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rivet_test -d rivet_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      RIVET_TEST_DB_HOST: 127.0.0.1
      RIVET_TEST_DB_PORT: 5432
      RIVET_TEST_DB_PASSWORD: rivet_ci_test_only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew :core:postgresTest --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: postgres-${{ matrix.version }}-tests
          path: rivet/core/build/reports/tests/postgresTest/
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r rivet/tooling/requirements.txt
      - run: python rivet/tooling/seed/rivet.py validate template
      - run: python -m unittest discover -s rivet/tooling/tests

  ui:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RIVET_UI_SCREENSHOTS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1
      - name: Prepare fresh Minecraft test client
        timeout-minutes: 10
        run: |
          ./gradlew :mod:prepareClientRun -PrivetUiHarness --no-daemon --console=plain
          # Fixed viewport matches the local full-flow checks at GUI scales 1–3.
          cat > ui-client.init.gradle <<'EOF'
          gradle.projectsEvaluated {
            gradle.rootProject.project(':mod').neoForge.runs.named('client') {
              programArgument '--width'; programArgument '1280'
              programArgument '--height'; programArgument '1024'
            }
          }
          EOF
          mkdir -p rivet/mod/run
          # Automated clients cannot dismiss Minecraft's first-launch welcome screen.
          printf 'onboardAccessibility:false\n' > rivet/mod/run/options.txt
      - name: Check native components
        timeout-minutes: 6
        env:
          RIVET_APPROVED_UI: ${{ github.workspace }}/visual/approved
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=20s 5m xvfb-run -a -s '-screen 0 1280x1024x24' ./gradlew :mod:runClient -PrivetUiHarness -I ui-client.init.gradle --no-daemon --console=plain 2>&1 | tee visual-approved.log
      - run: python3 rivet/tooling/verify_ui_snapshots.py visual/approved/screenshots checks visual-approved.log RIVET_APPROVED_UI_OK
      - name: Check HUD
        timeout-minutes: 6
        env:
          RIVET_HUD_UI: ${{ github.workspace }}/visual/hud
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=20s 5m xvfb-run -a -s '-screen 0 1280x1024x24' ./gradlew :mod:runClient -PrivetUiHarness -I ui-client.init.gradle --no-daemon --console=plain 2>&1 | tee visual-hud.log
      - run: python3 rivet/tooling/verify_ui_snapshots.py visual/hud/screenshots checks visual-hud.log RIVET_HUD_UI_OK
      - name: Check task flows and navigation
        timeout-minutes: 6
        env:
          RIVET_NATIVE_UI: ${{ github.workspace }}/visual/tasks
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=20s 5m xvfb-run -a -s '-screen 0 1280x1024x24' ./gradlew :mod:runClient -PrivetUiHarness -I ui-client.init.gradle --no-daemon --console=plain 2>&1 | tee visual-tasks.log
      - run: python3 rivet/tooling/verify_ui_snapshots.py visual/tasks/screenshots checks visual-tasks.log RIVET_NATIVE_OK
      - name: Check adaptive layouts and live resizing
        timeout-minutes: 6
        env:
          RIVET_ADAPTIVE_UI: ${{ github.workspace }}/visual/adaptive
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=20s 5m xvfb-run -a -s '-screen 0 1280x1024x24' ./gradlew :mod:runClient -PrivetUiHarness -I ui-client.init.gradle --no-daemon --console=plain 2>&1 | tee visual-adaptive.log
      - run: python3 rivet/tooling/verify_ui_snapshots.py visual/adaptive/screenshots checks visual-adaptive.log RIVET_ADAPTIVE_UI_OK
      - name: Verify drag ordering and cancellation
        timeout-minutes: 6
        env:
          RIVET_REORDER_UI: ${{ github.workspace }}/visual/reorder
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=20s 5m xvfb-run -a -s '-screen 0 1280x1024x24' ./gradlew :mod:runClient -PrivetUiHarness -I ui-client.init.gradle --no-daemon --console=plain 2>&1 | tee visual-reorder.log
      - run: python3 rivet/tooling/verify_ui_snapshots.py visual/reorder/screenshots checks visual-reorder.log RIVET_REORDER_UI_OK
      - name: Check TAB player lists and input handling
        timeout-minutes: 6
        env:
          RIVET_TAB_LAYOUT_CHECK: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=20s 5m xvfb-run -a -s '-screen 0 1280x1024x24' ./gradlew :mod:runClient -PrivetUiHarness -I ui-client.init.gradle --no-daemon --console=plain 2>&1 | tee visual-tab.log
          python3 rivet/tooling/verify_ui_snapshots.py unused checks visual-tab.log RIVET_TAB_LAYOUT_OK
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: ui-regression-logs
          path: |
            visual-*.log
            rivet/mod/run/logs/
            rivet/mod/run/crash-reports/

  modules:
    needs: [plan, java]
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      database:
        image: postgres:18
        env:
          POSTGRES_USER: rivet_test
          POSTGRES_PASSWORD: rivet_ci_test_only
          POSTGRES_DB: rivet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rivet_test -d rivet_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      RIVET_TEST_DB_PASSWORD: rivet_ci_test_only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Build packaged server and isolated fixtures
        run: ./gradlew :bootstrap:jar :mod:compatibilityTestJar -PrivetPackaged --no-daemon --console=plain
      - name: Check feature startup and shutdown
        run: |
          set -o pipefail
          for mode in default disabled base; do
            game="$GITHUB_WORKSPACE/module-checks/$mode"
            python3 rivet/tooling/module_smoke.py prepare "$mode" "$game"
            RIVET_MODULE_SMOKE="$mode" timeout --signal=TERM --kill-after=20s 5m ./gradlew :mod:runServer -PrivetPackaged -I "$game/server.init.gradle" --no-daemon --console=plain 2>&1 | tee "module-$mode.log"
            python3 rivet/tooling/module_smoke.py verify "module-$mode.log"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: module-regression-logs
          path: |
            module-*.log
            module-checks/*/logs/
            module-checks/*/crash-reports/

  release:
    needs: [plan, java, contracts, postgres, ui, modules]
    if: needs.plan.outputs.publish == 'true'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release.yml
