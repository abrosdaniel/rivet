name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  java:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew build --no-daemon
        shell: bash
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rivet-${{ matrix.os }}
          path: |
            rivet/mod/build/libs/*.jar
            rivet/core/build/reports/tests/
            rivet/helper/build/reports/tests/
            rivet/helper/build/test-results/
            rivet/bootstrap/build/reports/tests/
  postgres:
    strategy:
      fail-fast: false
      matrix:
        version: [17, 18]
    runs-on: ubuntu-latest
    services:
      database:
        image: postgres:${{ matrix.version }}
        env:
          POSTGRES_USER: rivet_test
          POSTGRES_PASSWORD: rivet_ci_test_only
          POSTGRES_DB: rivet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rivet_test -d rivet_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      RIVET_TEST_DB_HOST: 127.0.0.1
      RIVET_TEST_DB_PORT: 5432
      RIVET_TEST_DB_PASSWORD: rivet_ci_test_only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew :core:postgresTest --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: postgres-${{ matrix.version }}-tests
          path: rivet/core/build/reports/tests/postgresTest/
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r rivet/tooling/requirements.txt
      - run: python rivet/tooling/seed/rivet.py validate template
      - run: python -m unittest discover -s rivet/tooling/tests

  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libopenal1
      - name: Prepare fresh Minecraft test client
        timeout-minutes: 10
        run: |
          ./gradlew :mod:prepareClientRun -PrivetUiHarness --no-daemon --console=plain
          mkdir -p rivet/mod/run
          # Automated clients cannot dismiss Minecraft's first-launch welcome screen.
          printf 'onboardAccessibility:false\n' > rivet/mod/run/options.txt
      - name: Render and verify native components
        timeout-minutes: 6
        env:
          RIVET_APPROVED_UI: ${{ github.workspace }}/visual/approved
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=20s 5m xvfb-run -a -s '-screen 0 1280x1024x24' ./gradlew :mod:runClient -PrivetUiHarness --no-daemon --console=plain 2>&1 | tee visual-approved.log
      - run: python3 rivet/tooling/verify_ui_snapshots.py visual/approved/screenshots 300 visual-approved.log RIVET_APPROVED_UI_OK
      - name: Render and verify HUD
        timeout-minutes: 6
        env:
          RIVET_HUD_UI: ${{ github.workspace }}/visual/hud
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=20s 5m xvfb-run -a -s '-screen 0 1280x1024x24' ./gradlew :mod:runClient -PrivetUiHarness --no-daemon --console=plain 2>&1 | tee visual-hud.log
      - run: python3 rivet/tooling/verify_ui_snapshots.py visual/hud/screenshots 360 visual-hud.log RIVET_HUD_UI_OK
      - name: Render and verify task flows and navigation
        timeout-minutes: 6
        env:
          RIVET_NATIVE_UI: ${{ github.workspace }}/visual/tasks
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=20s 5m xvfb-run -a -s '-screen 0 1280x1024x24' ./gradlew :mod:runClient -PrivetUiHarness --no-daemon --console=plain 2>&1 | tee visual-tasks.log
      - run: python3 rivet/tooling/verify_ui_snapshots.py visual/tasks/screenshots auto visual-tasks.log RIVET_NATIVE_OK
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: visual-regression-screenshots
          path: |
            visual/
            visual-*.log
            rivet/mod/run/logs/
            rivet/mod/run/crash-reports/

  release:
    needs: [java, contracts, postgres, visual]
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release.yml
