name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run the complete platform, database and Minecraft checks
        type: boolean
        default: true
concurrency:
  group: rivet-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.select.outputs.full }}
      publish: ${{ steps.select.outputs.publish }}
      platforms: ${{ steps.select.outputs.platforms }}
      postgres: ${{ steps.select.outputs.postgres }}
      checks: ${{ steps.select.outputs.checks }}
      native: ${{ steps.select.outputs.native }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FULL: ${{ github.event_name != 'workflow_dispatch' || inputs.full }}
        run: python3 rivet/tooling/ci_plan.py --event "$EVENT" --ref "$REF" --default-branch "$DEFAULT_BRANCH" --full "$FULL" --base "$BASE" >> "$GITHUB_OUTPUT"
  java-linux:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.checks), 'java')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Prepare Gradle distribution
        timeout-minutes: 10
        shell: bash
        run: bash rivet/tooling/prepare_gradle.sh
      - name: Prepare shared native runtime
        if: runner.os == 'Linux' && needs.plan.outputs.native == 'true'
        run: python3 rivet/tooling/ci_runtime.py prepare native-build native-runtime
      - name: Build and test
        shell: bash
        run: |
          if [ -f native-build/runs.init.gradle ]; then
            ./gradlew -I native-build/runs.init.gradle -PrivetUiHarness build --no-daemon
          else
            ./gradlew build --no-daemon
          fi
      - name: Archive native runtime
        if: runner.os == 'Linux' && needs.plan.outputs.native == 'true'
        run: tar -cf native-runtime.tar native-runtime
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: runner.os == 'Linux' && needs.plan.outputs.native == 'true'
        with:
          name: native-runtime
          overwrite: true
          path: native-runtime.tar
          compression-level: 1
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rivet-ubuntu-latest
          overwrite: true
          path: |
            rivet/mod/build/libs/*.jar
            native-build/build/*/reports/tests/
            native-build/build/*/test-results/
            rivet/mod/build/reports/tests/
            rivet/mod/build/test-results/
            rivet/api/build/reports/tests/
            rivet/core/build/reports/tests/
            rivet/helper/build/reports/tests/
            rivet/helper/build/test-results/
            rivet/bootstrap/build/reports/tests/
  java-platforms:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.checks), 'java') && needs.plan.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Prepare Gradle distribution
        timeout-minutes: 10
        shell: bash
        run: bash rivet/tooling/prepare_gradle.sh
      - name: Build and test
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rivet-${{ matrix.os }}
          overwrite: true
          path: |
            rivet/mod/build/libs/*.jar
            native-build/build/*/reports/tests/
            native-build/build/*/test-results/
            rivet/mod/build/reports/tests/
            rivet/mod/build/test-results/
            rivet/api/build/reports/tests/
            rivet/core/build/reports/tests/
            rivet/helper/build/reports/tests/
            rivet/helper/build/test-results/
            rivet/bootstrap/build/reports/tests/
  java:
    needs: [plan, java-linux, java-platforms]
    if: always() && contains(fromJSON(needs.plan.outputs.checks), 'java')
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected Java platform
        env:
          LINUX: ${{ needs.java-linux.result }}
          PLATFORMS: ${{ needs.java-platforms.result }}
          FULL: ${{ needs.plan.outputs.full }}
        run: |
          test "$LINUX" = success
          if [ "$FULL" = true ]; then test "$PLATFORMS" = success; fi
  postgres:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.checks), 'postgres')
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.plan.outputs.postgres) }}
    runs-on: ubuntu-latest
    services:
      database:
        image: postgres:${{ matrix.version }}
        env:
          POSTGRES_USER: rivet_test
          POSTGRES_PASSWORD: rivet_ci_test_only
          POSTGRES_DB: rivet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rivet_test -d rivet_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      RIVET_TEST_DB_HOST: 127.0.0.1
      RIVET_TEST_DB_PORT: 5432
      RIVET_TEST_DB_PASSWORD: rivet_ci_test_only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Prepare Gradle distribution
        timeout-minutes: 10
        shell: bash
        run: bash rivet/tooling/prepare_gradle.sh
      - run: ./gradlew :core:postgresTest --no-daemon
      - name: Verify read-only feature archive
        env:
          RIVET_TEST_ARCHIVE_CONTAINER: ${{ job.services.database.id }}
        run: python3 -m unittest discover -s rivet/tooling/tests -p test_feature_archive_postgres.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: postgres-${{ matrix.version }}-tests
          path: rivet/core/build/reports/tests/postgresTest/
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r rivet/tooling/requirements.txt
      - run: python -m unittest discover -s rivet/tooling/tests

  ui:
    needs: [plan, java-linux]
    if: contains(fromJSON(needs.plan.outputs.checks), 'ui')
    strategy:
      fail-fast: false
      matrix:
        language: [ru_ru, en_us]
        suite: [components, interaction, layout]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RIVET_UI_SCREENSHOTS: 'false'
      RIVET_UI_LANGUAGE: ${{ matrix.language }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download native runtime from this run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh run download "$RUN_ID" --name native-runtime --dir runtime-download
          tar -xf runtime-download/native-runtime.tar
          echo "RIVET_TEST_RUNTIME=$GITHUB_WORKSPACE/native-runtime" >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libegl1 libfontconfig1 libfreetype6 libopenal1
      - name: Check pack components and appearance profiles
        if: matrix.suite == 'components'
        timeout-minutes: 6
        env:
          RIVET_RELEASE_CORRECTIONS: ${{ github.workspace }}/visual/pack
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=20s 5m xvfb-run -a -s '-screen 0 1280x1024x24' python3 rivet/tooling/ci_ui.py 2>&1 | tee visual-pack.log
          python3 rivet/tooling/verify_ui_snapshots.py unused checks visual-pack.log RIVET_RELEASE_CORRECTIONS_OK
      - name: Check native components
        if: matrix.suite == 'components'
        timeout-minutes: 6
        env:
          RIVET_APPROVED_UI: ${{ github.workspace }}/visual/approved
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=20s 5m xvfb-run -a -s '-screen 0 1280x1024x24' python3 rivet/tooling/ci_ui.py 2>&1 | tee visual-approved.log
      - run: python3 rivet/tooling/verify_ui_snapshots.py visual/approved/screenshots checks visual-approved.log RIVET_APPROVED_UI_OK
        if: matrix.suite == 'components'
      - name: Check account and moderation dialogs
        if: matrix.suite == 'components'
        timeout-minutes: 6
        env:
          RIVET_NESTED_UI: ${{ github.workspace }}/visual/nested
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=20s 5m xvfb-run -a -s '-screen 0 1280x1024x24' python3 rivet/tooling/ci_ui.py 2>&1 | tee visual-nested.log
          python3 rivet/tooling/verify_ui_snapshots.py unused checks visual-nested.log RIVET_NESTED_UI_OK
      - name: Check HUD
        if: matrix.suite == 'interaction'
        timeout-minutes: 6
        env:
          RIVET_HUD_UI: ${{ github.workspace }}/visual/hud
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=20s 5m xvfb-run -a -s '-screen 0 1280x1024x24' python3 rivet/tooling/ci_ui.py 2>&1 | tee visual-hud.log
      - run: python3 rivet/tooling/verify_ui_snapshots.py visual/hud/screenshots checks visual-hud.log RIVET_HUD_UI_OK
        if: matrix.suite == 'interaction'
      - name: Check task flows and navigation
        if: matrix.suite == 'interaction'
        timeout-minutes: 6
        env:
          RIVET_NATIVE_UI: ${{ github.workspace }}/visual/tasks
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=20s 5m xvfb-run -a -s '-screen 0 1280x1024x24' python3 rivet/tooling/ci_ui.py 2>&1 | tee visual-tasks.log
          python3 rivet/tooling/verify_ui_snapshots.py visual/tasks/screenshots checks visual-tasks.log RIVET_NATIVE_OK
      - name: Check adaptive layouts and live resizing
        if: matrix.suite == 'layout'
        timeout-minutes: 6
        env:
          RIVET_ADAPTIVE_UI: ${{ github.workspace }}/visual/adaptive
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=20s 5m xvfb-run -a -s '-screen 0 1280x1024x24' python3 rivet/tooling/ci_ui.py 2>&1 | tee visual-adaptive.log
      - run: python3 rivet/tooling/verify_ui_snapshots.py visual/adaptive/screenshots checks visual-adaptive.log RIVET_ADAPTIVE_UI_OK
        if: matrix.suite == 'layout'
      - name: Verify drag ordering and cancellation
        if: matrix.suite == 'interaction'
        timeout-minutes: 6
        env:
          RIVET_REORDER_UI: ${{ github.workspace }}/visual/reorder
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=20s 5m xvfb-run -a -s '-screen 0 1280x1024x24' python3 rivet/tooling/ci_ui.py 2>&1 | tee visual-reorder.log
      - run: python3 rivet/tooling/verify_ui_snapshots.py visual/reorder/screenshots checks visual-reorder.log RIVET_REORDER_UI_OK
        if: matrix.suite == 'interaction'
      - name: Check TAB player lists and input handling
        if: matrix.suite == 'interaction'
        timeout-minutes: 6
        env:
          RIVET_TAB_LAYOUT_CHECK: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=20s 5m xvfb-run -a -s '-screen 0 1280x1024x24' python3 rivet/tooling/ci_ui.py 2>&1 | tee visual-tab.log
          python3 rivet/tooling/verify_ui_snapshots.py unused checks visual-tab.log RIVET_TAB_LAYOUT_OK
      - name: Check settings and confirmation flows
        if: matrix.suite == 'components'
        timeout-minutes: 6
        env:
          RIVET_AUDIT_FIXES_UI: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=20s 5m xvfb-run -a -s '-screen 0 1280x1024x24' python3 rivet/tooling/ci_ui.py 2>&1 | tee visual-settings.log
          python3 rivet/tooling/verify_ui_snapshots.py unused checks visual-settings.log RIVET_AUDIT_FIXES_UI_OK
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: ui-regression-logs-${{ matrix.language }}-${{ matrix.suite }}
          include-hidden-files: true
          path: |
            visual-*.log
            .local/ci-ui/client/logs/
            .local/ci-ui/client/crash-reports/

  modules:
    needs: [plan, java-linux]
    if: contains(fromJSON(needs.plan.outputs.checks), 'modules')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      database:
        image: postgres:18
        env:
          POSTGRES_USER: rivet_test
          POSTGRES_PASSWORD: rivet_ci_test_only
          POSTGRES_DB: rivet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rivet_test -d rivet_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      RIVET_TEST_DB_PASSWORD: rivet_ci_test_only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download native runtime from this run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh run download "$RUN_ID" --name native-runtime --dir runtime-download
          tar -xf runtime-download/native-runtime.tar
          echo "RIVET_TEST_RUNTIME=$GITHUB_WORKSPACE/native-runtime" >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore tested packaged bundle and fixtures
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh run download "$RUN_ID" --name rivet-ubuntu-latest --dir tested
          mkdir -p rivet/mod/build/libs rivet/mod/build/compatibility-tests
          find tested -name 'rivet-*-mc1.21.1-neoforge.jar' -exec cp {} rivet/mod/build/libs/ \;
          cp native-runtime/build/mod/compatibility-tests/rivet-compatibility-tests.jar rivet/mod/build/compatibility-tests/
      - name: Check feature startup and shutdown
        run: |
          set -o pipefail
          for mode in default disabled base; do
            game="$GITHUB_WORKSPACE/module-checks/$mode"
            timeout --signal=TERM --kill-after=20s 5m python3 rivet/tooling/module_smoke.py run "$mode" "$game" 2>&1 | tee "module-$mode.log"
            python3 rivet/tooling/module_smoke.py verify "module-$mode.log"
          done
      - name: Check console API keys and REST lifecycle
        timeout-minutes: 10
        run: |
          python3 rivet/tooling/api_smoke.py api-native --http-port 24465 --luckperms
          cp api-native/server.log api-native/server-enabled.log
          python3 rivet/tooling/api_smoke.py api-native --http-port 24465 --without-http --luckperms
          cp api-native/server.log api-native/server-disabled.log
          python3 rivet/tooling/api_smoke.py api-native --http-port 24465 --saved-terrain
          python3 rivet/tooling/api_smoke.py terrain-recovery --http-port 24465 --scheduler-phase 1
          python3 rivet/tooling/api_smoke.py terrain-recovery --http-port 24465 --scheduler-phase 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: module-regression-logs
          path: |
            api-native/*.log
            terrain-recovery/*.log
            module-*.log
            module-checks/*/logs/
            module-checks/*/crash-reports/

  map-network:
    needs: [plan, java-linux]
    if: contains(fromJSON(needs.plan.outputs.checks), 'map-network')
    strategy:
      fail-fast: false
      matrix:
        suite: [data, appearance, terrain]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      database:
        image: postgres:18
        env:
          POSTGRES_USER: rivet_test
          POSTGRES_PASSWORD: rivet_ci_test_only
          POSTGRES_DB: rivet_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rivet_test -d rivet_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      RIVET_TEST_DB_PASSWORD: rivet_ci_test_only
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download native runtime from this run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh run download "$RUN_ID" --name native-runtime --dir runtime-download
          tar -xf runtime-download/native-runtime.tar
          echo "RIVET_TEST_RUNTIME=$GITHUB_WORKSPACE/native-runtime" >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libegl1 libfontconfig1 libfreetype6 libopenal1
      - name: Verify native scenarios
        env:
          SUITE: ${{ matrix.suite }}
        run: xvfb-run -a -s '-screen 0 1280x1024x24' python3 rivet/tooling/map_network.py map-network --suite "$SUITE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: map-network-${{ matrix.suite }}-logs
          path: |
            map-network/*.log
            map-network/server/logs/
            map-network/server/crash-reports/
            map-network/client/logs/
            map-network/client/crash-reports/

  builder:
    needs: [plan, java-linux]
    if: contains(fromJSON(needs.plan.outputs.checks), 'builder')
    strategy:
      fail-fast: false
      matrix:
        check: [layouts, routes]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      database:
        image: postgres:18
        env:
          POSTGRES_USER: rivet_test
          POSTGRES_PASSWORD: rivet_ci_test_only
          POSTGRES_DB: rivet_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rivet_test -d rivet_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      RIVET_TEST_DB_PASSWORD: rivet_ci_test_only
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download native runtime from this run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh run download "$RUN_ID" --name native-runtime --dir runtime-download
          tar -xf runtime-download/native-runtime.tar
          echo "RIVET_TEST_RUNTIME=$GITHUB_WORKSPACE/native-runtime" >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libegl1 libfontconfig1 libfreetype6 libopenal1
      - name: Download the tested Linux bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --name rivet-ubuntu-latest --dir tested
      - name: Restore run arguments
        run: python3 rivet/tooling/ci_runtime.py restore builder-runtime native-runtime
      - name: Verify packaged update and recovery
        env:
          CHECK: ${{ matrix.check }}
        run: |
          version=$(sed -n 's/^rivetVersion=//p' gradle.properties | tr -d '\r')
          bundle=$(find tested -name "rivet-$version-mc1.21.1-neoforge.jar" -print -quit)
          test -n "$bundle"
          extra=()
          if [ "$CHECK" = routes ]; then
            extra=(--routes direct proxy fallback --scales 3 --profiles default --alias-reconnect --prefer-ipv6)
          fi
          xvfb-run -a -s '-screen 0 1280x1024x24' python3 rivet/tooling/combined_update.py combined-update --runtime builder-runtime --fixtures native-runtime/build/mod/compatibility-tests/rivet-compatibility-tests.jar --bundle "$bundle" --version "$version" "${extra[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: builder-${{ matrix.check }}-logs
          path: |
            combined-update/*.log
            combined-update/server/logs/
            combined-update/server/crash-reports/
            combined-update/client-*/logs/
            combined-update/client-*/crash-reports/
            combined-update/client-*/rivet/runtime/helper.log
            combined-update/client-*/rivet/transactions/*/journal.json

  envelope:
    needs: [plan, java-linux]
    if: contains(fromJSON(needs.plan.outputs.checks), 'envelope')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      database:
        image: postgres:18
        env:
          POSTGRES_USER: rivet_test
          POSTGRES_PASSWORD: rivet_ci_test_only
          POSTGRES_DB: rivet_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rivet_test -d rivet_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      RIVET_TEST_DB_PASSWORD: rivet_ci_test_only
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download native runtime from this run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh run download "$RUN_ID" --name native-runtime --dir runtime-download
          tar -xf runtime-download/native-runtime.tar
          echo "RIVET_TEST_RUNTIME=$GITHUB_WORKSPACE/native-runtime" >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libegl1 libfontconfig1 libfreetype6 libopenal1
      - name: Verify Envelope identity and restart recovery
        run: python3 rivet/tooling/envelope_smoke.py envelope-native
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: envelope-regression-logs
          path: |
            envelope-native/*.log
            envelope-native/server/logs/
            envelope-native/server/crash-reports/

  permissions:
    needs: [plan, java-linux]
    if: contains(fromJSON(needs.plan.outputs.checks), 'permissions')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      database:
        image: postgres:18
        env:
          POSTGRES_USER: rivet_test
          POSTGRES_PASSWORD: rivet_ci_test_only
          POSTGRES_DB: rivet_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rivet_test -d rivet_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      RIVET_TEST_DB_PASSWORD: rivet_ci_test_only
      LIBGL_ALWAYS_SOFTWARE: '1'
      RIVET_PERMISSION_EDIT_TEST: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download native runtime from this run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh run download "$RUN_ID" --name native-runtime --dir runtime-download
          tar -xf runtime-download/native-runtime.tar
          echo "RIVET_TEST_RUNTIME=$GITHUB_WORKSPACE/native-runtime" >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libegl1 libfontconfig1 libfreetype6 libopenal1
      - name: Verify role permissions and authenticated rename
        run: xvfb-run -a -s '-screen 0 1280x1024x24' python3 rivet/tooling/role_network.py role-network
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: role-permission-regression-logs
          path: |
            role-network/*.log
            role-network/server/logs/
            role-network/server/crash-reports/
            role-network/client/logs/
            role-network/client/crash-reports/

  trade:
    needs: [plan, java-linux]
    if: contains(fromJSON(needs.plan.outputs.checks), 'trade')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      database:
        image: postgres:18
        env:
          POSTGRES_USER: rivet_test
          POSTGRES_PASSWORD: rivet_ci_test_only
          POSTGRES_DB: rivet_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rivet_test -d rivet_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      RIVET_TEST_DB_PASSWORD: rivet_ci_test_only
      LIBGL_ALWAYS_SOFTWARE: '1'
      RIVET_UI_SCREENSHOTS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download native runtime from this run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh run download "$RUN_ID" --name native-runtime --dir runtime-download
          tar -xf runtime-download/native-runtime.tar
          echo "RIVET_TEST_RUNTIME=$GITHUB_WORKSPACE/native-runtime" >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libegl1 libfontconfig1 libfreetype6 libopenal1
      - name: Verify offline trades, recovery and HD appearance
        run: xvfb-run -a -s '-screen 0 1280x1024x24' python3 rivet/tooling/trade_network.py trade-network --prepare --hd-check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: trade-regression-logs
          path: |
            trade-network/*.log
            trade-network/server/logs/
            trade-network/server/crash-reports/
            trade-network/client/logs/
            trade-network/client/crash-reports/

  api-proxy:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.checks), 'api-proxy')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Prepare Gradle distribution
        timeout-minutes: 10
        run: bash rivet/tooling/prepare_gradle.sh
      - name: Verify HTTPS and WSS through Nginx
        run: python3 rivet/tooling/api_proxy_smoke.py "$RUNNER_TEMP/rivet-api-proxy"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: api-proxy-results
          path: |
            ${{ runner.temp }}/rivet-api-proxy/run.log
            ${{ runner.temp }}/rivet-api-proxy/nginx.log
            ${{ runner.temp }}/rivet-api-proxy/results/proxy.json

  verified:
    needs: [plan, java, contracts, postgres, ui, modules, map-network, builder, envelope, permissions, trade, api-proxy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYVERIFY'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          required = ['plan', 'contracts'] + json.loads(jobs['plan']['outputs'].get('checks', '[]'))
          failed = [name for name in required if jobs[name]['result'] != 'success']
          if failed:
              raise SystemExit('Required checks did not pass: ' + ', '.join(failed))
          PYVERIFY
      - name: Record release eligibility
        env:
          PUBLISH: ${{ needs.plan.outputs.publish }}
          COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PYINTENT'
          import json, os
          from pathlib import Path
          Path('release-intent.json').write_text(json.dumps({'publish': os.environ['PUBLISH'] == 'true', 'commit': os.environ['COMMIT']}))
          PYINTENT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-intent
          path: release-intent.json
