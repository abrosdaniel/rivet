# Rivet — config/rivet-server.toml. Справочник: https://abrosdaniel.github.io/rivet/server/configuration/
# [menu] и [community]: администрация → настройки сервера → «Проверить файл заново»
# → «Применить меню и разделы». Остальные разделы: полный перезапуск сервера.
# PostgreSQL обязательна, даже если Auth выключен. Ошибка останавливает запуск.
# Строки пишутся в кавычках, true/false и целые числа — без кавычек.
# Исключение: auth.mode = "false" — именно строка в кавычках.
# Необязательные параметры можно пропустить: используются стандартные значения.
# [connection], [auth], [database] нужно сохранить полностью.
# При обновлении отсутствующие параметры добавляются с пояснениями.
# Ваши значения сохраняются; резервная копия остаётся рядом с конфигом.

[connection]
# Ожидание ответа клиента, секунды. Диапазон: 3–60.
handshakeTimeout = 10

[auth]
# "false" — выключен, "base" — пароль, "hybrid" — пароль + официальный аккаунт.
mode = "false"
# Разрешить самостоятельную регистрацию.
registration = true
# Минимум для НОВЫХ паролей: 6–128 символов. Старые пароли сохраняются.
minPasswordLength = 6

[database]
# Адрес PostgreSQL: 127.0.0.1, имя контейнера в общей сети или адрес хоста БД.
host = "127.0.0.1"
# Диапазон: 1–65535.
port = 5432
# Имя существующей базы и пользователя PostgreSQL; могут отличаться от названия мода.
database = "rivet"
username = "rivet"
# Пароль PostgreSQL. Для обратных слешей удобно использовать 'буквальную строку'.
password = ""
# Необязательно: имя переменной окружения вместо password.
# Если указано, переменная ОБЯЗАНА содержать пароль; скрытого fallback нет.
passwordEnv = ""
# Пул соединений: 2–32.
pool = 8
# "verify-full" — TLS с проверкой сертификата и имени хоста (по умолчанию);
# "disable" — без TLS, для доверенной внутренней сети.
sslMode = "verify-full"
# Путь к корневому сертификату при необходимости.
sslCert = ""

[pack]
# Управление клиентской сборкой. Выключение не отключает другие модули Rivet.
enabled = false
# Требовать обязательные файлы опубликованной сборки при входе.
required = true
# Папка подготовки относительно папки сервера. Публикация только явной командой.
directory = "rivet/pack"

[pack.network]
# Адрес прослушивания внутри контейнера.
bind = "0.0.0.0"
# TCP-порт раздачи: 1–65535. Не игровой порт Minecraft.
port = 25567
# Публичный хост; пусто — использовать адрес игрового сервера.
host = ""
# Публичный порт после проброса контейнера: 1–65535.
publicPort = 25567

[pack.protection]
# Соединения с одного IP; учитывайте игроков за общим NAT. 1–64.
connectionsPerAddress = 16
# Запросы в секунду с одного IP, краткий всплеск — двойное значение. 1–1000.
requestsPerSecond = 8
# Срок блокирующей операции ввода/вывода без прогресса; не длительность загрузки. 1–300 с.
idleSeconds = 30
# Максимальное ожидание слота загрузки. 1–600 с.
queueSeconds = 120

[pack.downloads]
# Общая скорость раздачи, МиБ/с. 0 — без ограничения.
totalMiB = 20
# Скорость одной загрузки, МиБ/с. 0 — без ограничения.
clientMiB = 5
# Одновременных загрузок; остальные ждут. 0 — без ограничения загрузок.
concurrent = 4

[statistics]
# Выключенное поле не собирается и не показывается. История в БД сохраняется.
# Дата первого входа и последняя активность.
firstJoin = true
lastActivity = true
# Общее время также используется для допуска к голосованиям о наказании.
playTime = true
# Сбор времени сессии; показ в виджете игрок включает отдельно у себя.
session = true
# Число смертей.
deaths = true

[skins]
# Библиотека и синхронизация скинов игроков.
enabled = true
# Максимум загружаемого PNG в МиБ: 1–16. Разрешение: 64×64 или 64×32.
maxSizeMiB = 1
# Сохранённых скинов на игрока: 1–5. «Обычный» место не занимает.
maxPerPlayer = 2
# "false" — стандартный; "UUID" — подтверждённый Mojang UUID; "nickname" — поиск по нику.
fallback = "false"

[votes]
# По умолчанию выключены; защищённые игроки не могут быть целью.
enabled = false
# Участников без учёта цели: 5–300.
minPlayers = 5
# Длительность голосования, секунды: 30–600.
durationSeconds = 120
# Учтённое время инициатора, минуты: 0–10080.
minPlayMinutes = 120
# Пауза для инициатора и защита цели от повторного голосования: 1–10080 минут.
initiatorCooldownMinutes = 30
targetCooldownMinutes = 60

[votes.actions]
kick = true
ban = true
# Требуется доступная интеграция Plasmo Voice или Simple Voice Chat.
mute = true
# Срок бана или мута выбирает инициатор голосования: 1–1440 минут.

[community]
# Название раздела, 1–40 символов.
groupsTitle = "Объединения"
# Максимум объединений на игрока: 1–20.
maxMemberships = 3
# Необязательные категории доски, до 20 уникальных названий по 40 символов.
categories = []
# Типы объединений: 1–20 уникальных названий по 40 символов.
groupTypes = ["Город", "Команда", "Гильдия", "Поселение"]
# home = Главная, players = Игроки, board = Доска объявлений, groups = Объединения;
# events = События, polls = Голосования, ideas = Предложения, notifications = Уведомления.
# home и notifications обязательны; остальные разделы можно убрать из списка.
sections = ["home", "players", "board", "groups", "events", "polls", "ideas", "notifications"]

[menu]
# Текст помощи, до 2000 символов.
help = "Откройте меню командой /rivet. За помощью обратитесь к администрации сервера."
# Ссылки отображаются в разделе «Помощь»; пустой список скрывает кнопку.
# До 12 ссылок: имя до 60 символов, адрес HTTPS до 512 символов.
# Пример: links = [{ name = "Сайт", url = "https://example.org" }]
links = []

[updates]
# Проверять обновления и сообщать в консоль: при запуске и раз в 6 часов.
console = true

[retention]
# Закрытые обращения и корзина: 1–365 дней. Открытые обращения сохраняются.
reportDays = 30
trashDays = 30
# Последних событий журнала: 100–100000. История наказаний хранится отдельно.
auditEntries = 1000

# Функциональные модули: выключение прекращает обработку запросов и фоновые действия.
# Данные сохраняются. Изменения применяются после полного перезапуска сервера.
# Интеграции подключаются автоматически для работающих модулей.
[groups]
# Участники, роли, приглашения и общие данные объединений.
enabled = true

[board]
# Доска объявлений, категории и отклики.
enabled = true

[events]
# События, участники и напоминания.
enabled = true

[polls]
# Обычные опросы; голосования о наказании настраиваются отдельно в [votes].
enabled = true

[ideas]
# Предложения игроков и поддержка идей.
enabled = true

[reports]
# Обращения, ответы администрации и действия модерации Rivet.
# Права и команды модерации Minecraft и других модов не меняются.
enabled = true

[server]
# Управление сервером: объявления администрации, обслуживание и запланированная остановка.
# Настройки меню и диагностика остаются доступными администрации.
enabled = true

[storage]
# Привязанные хранилища, сбор содержимого и голограммы.
# Требует tasks.enabled = true. Для отключения задач выключите и этот модуль.
enabled = true

[tasks]
# Личные и общие задачи, этапы, комментарии и сроки.
# При groups.enabled = false личные задачи продолжают работать.
enabled = true
# Все задачи, созданные игроком: личные и задачи объединений, включая архив.
# 0 — без ограничения. Снижение лимитов не удаляет существующие записи.
maxPerOwner = 200
# Подзадач на одну задачу. 0 — без ограничения.
maxSubtasks = 30
# Комментариев на одну задачу. 0 — без ограничения.
maxComments = 100

[spark]
# Используется автоматически при наличии серверного spark.
# Предупреждения получают администраторы с правом rivet.diagnostics.
# TPS — тики в секунду (обычно 20); MSPT — время одного тика в миллисекундах.
# Предупреждение при TPS ниже порога ИЛИ MSPT выше порога.
# TPS: 1–20; MSPT: 1–1000 мс.
minTps = 18
maxMspt = 50
# Как долго нагрузка должна непрерывно превышать порог: 1–3600 секунд.
durationSeconds = 30
# Минимальная пауза между предупреждениями: 1–86400 секунд.
cooldownSeconds = 300

[chat]
# История: последние 0–1000 сообщений на канал; 0 отключает запись и синхронизацию.
# При входе выдаётся не больше этого числа сообщений всех доступных каналов.
history = 100
# Хранение истории в PostgreSQL, 1–365 дней.
historyDays = 7
# false — не обрабатывать сообщения, каналы и вставки Rivet.
# Чат остаётся Minecraft или другому моду; требуется перезапуск сервера.
enabled = true
# Названия каналов; пустое название скрывает метку. Эмодзи можно вписать в название.
# Без префикса — локальный канал; !текст — общий; #Название: текст — объединение.
localName = "Рядом"
globalName = ""
# Цвета меток каналов в сообщениях и над строкой ввода: "#RRGGBB".
# Цвет текста сообщения и оформление LuckPerms не меняются.
localColor = "#83C6C4"
globalColor = "#E2BE75"
groupColor = "#B9A3F2"
# Общий шаблон всех каналов: $channel, $head, $prefix, $nickname, $suffix, $message.
# $nickname и $message обязательны; каждую переменную используйте не более одного раза.
# $head — голова при включённом показе у игрока. $$ — буквальный знак доллара.
# Префикс добавляет пробел после себя, суффикс — перед собой, только если заполнены.
format = "$channel$head$prefix$nickname$suffix: $message"
# $channel здесь — название канала. Пустое название скрывает весь этот блок.
# До 512 символов в одной строке; изменения применяются после перезапуска.
channelFormat = "[$channel] | "
# Разрешить [pos] — кликабельные координаты. При false остаётся обычным текстом.
coordinates = true
# Локальный канал: радиус 1–1000 блоков, отдельно в каждом измерении.
local = true
localRadius = 100
# Канал объединений использует участников из базы данных Rivet.
group = true

[display]
# Режим оформления TAB передаётся всем клиентам сервером.
# "auto" — уступать известным модам оформления на клиенте;
# "rivet" — оформление Rivet; "compatible" — стандартное оформление.
tab = "auto"

# Имена над головой на клиентах Rivet:
# "rivet" — префикс LuckPerms + ник + суффикс; без LuckPerms — обычное имя.
# "base" — обычные имена Minecraft; "hidden" — скрыть имена игроков.
# Требуется перезапуск сервера. Для hidden нужен клиент Rivet с поддержкой режима.
# UUID и ник аккаунта не меняются; чат и TAB настраиваются отдельно.
nameplates = "rivet"

[map]
# Карта Rivet: исследование поверхности и личные метки.
# false — отключить карту и команды навигации Rivet; данные сохраняются.
# Изменение применяется после полного перезапуска сервера.
enabled = true

# Разрешить пещерные слои карты и миникарты из загруженных клиентом чанков.
# false — оставить только поверхность; сохранённые пещерные карты не удаляются.
caves = true
# Разрешить радар уже полученных клиентом существ, игроков и предметов.
radar = true

# Позиции игроков на карте с учётом их режима и аудитории.
# По умолчанию у нового игрока: вся карта, все игроки.
positions = true
# Радиус режима «Только рядом» в блоках (1–4096), в том же измерении.
# Проверяется расстояние в трёх измерениях. Требуется перезапуск сервера.
nearbyRadius = 128

[api]
# Срок внешней сессии в часах (1–720). Перезапуск сервера завершает сессии.
sessionHours = 24
# Общий предел внешних сессий (1–10000), не более 10 на игрока и ключ.
sessionLimit = 1024
# Максимальное количество сохранённых API-ключей (включая отозванные до очистки).
keyLimit = 256
# Максимальное количество действующих ключей одного приложения.
appKeyLimit = 8
# Общий лимит запросов приложения в минуту; новые ключи не увеличивают этот бюджет.
requestsPerMinute = 120
# Максимальный срок API-ключа в днях; срок всегда указывается при создании.
maxKeyDays = 365
# Хранение метаданных отозванных и истёкших ключей в днях.
keyRetentionDays = 30
# Ограничение журнала выдачи, изменения и отзыва ключей.
auditEntries = 10000

[api.http]
# Внешний REST API. По умолчанию порт не открывается.
enabled = false
# Только loopback; внешний HTTPS настраивается через reverse proxy владельца.
bind = "127.0.0.1"
port = 24464
# Максимум одновременных соединений и соединений с одного адреса.
connections = 32
connectionsPerAddress = 16
# Отдельные рабочие потоки API и ограниченная очередь; игровой поток не используется.
workers = 2
queue = 32
# Полный срок запроса, включая получение заголовков, ожидание и ответ.
timeoutSeconds = 10
# Общий бюджет HTTP-запросов и бюджет фактического адреса соединения до проверки ключа.
# За proxy все его запросы делят бюджет адреса; forwarded-заголовки не считаются доверенными.
requestsPerMinute = 600
addressRequestsPerMinute = 120
# Точные HTTPS origins браузерных потребителей публичных ресурсов и WebSocket tickets, без завершающего /.
origins = []
# Явно разрешённые анонимные ресурсы: capabilities, server.status, server.status.events, openapi.
# Пусто — для каждого ресурса требуется ключ. Данные игроков не публикуются.
publicResources = []

[api.websocket]
# Одноразовый браузерный ticket: срок предъявления, секунд (5–120).
ticketSeconds = 30
# Максимум ожидающих tickets на сервере и на один ключ приложения.
ticketLimit = 1024
ticketsPerKey = 16
# WebSocket для доверенных backend-приложений; постоянный ключ не передавать браузеру.
enabled = false
# Отдельный loopback-порт, внешний WSS — через reverse proxy владельца.
bind = "127.0.0.1"
port = 24465
# Максимум соединений (каждое занимает отдельный рабочий поток, без очереди команд).
connections = 16
# Общий бюджет входящих сообщений и подключений в минуту; на соединение — не более 120.
requestsPerMinute = 600

[api.terrain]
# Дополнительный объёмный изометрический профиль: отдельный кэш и фоновая отрисовка.
isometric = false
# Самостоятельные серверные PNG-тайлы. Не используют исследование игроков; по умолчанию выключены.
enabled = false
# Разрешённые измерения. Отображается поверхность, без пещер.
dimensions = ["minecraft:overworld"]
# Прямоугольник публикации в координатах блоков, границы включительно.
minX = -2048
minZ = -2048
maxX = 2047
maxZ = 2047
# Скрытые прямоугольники во всех разрешённых измерениях: "minX,minZ,maxX,maxZ".
# Маска применяется до создания изображений всех масштабов.
hidden = []
# Дополнительные скрытые области общих surface/isometric; приватные профили их не наследуют.
publicHidden = []
# Пещеры только явно: {id = "caves", projection = "cave", minY = -64, maxY = 32, hidden = []}.
# minY/maxY включительно, диапазон 4–256 блоков; отдельное право map.tiles.profile.caves.
# До 4 приватных профилей: {id = "staff", projection = "surface", hidden = ["0,0,15,15"]}.
# Доступ только ключам со scope map.tiles.profile.staff; глобальный hidden действует всегда.
profiles = []
# Тайлы 16x16 пикселей: zoom 0 = 1 блок/пиксель; каждый следующий уровень удваивает масштаб.
maxZoom = 4
# Максимум PNG-файлов в производном кэше, включая все масштабы.
maxTiles = 4096
# Радиус обхода уже загруженных чанков вокруг игроков; принудительная загрузка и генерация запрещены.
radius = 4
# Предел столбцов и мягкий бюджет чтения мира за тик в микросекундах.
columnsPerTick = 64
budgetMicros = 1000
