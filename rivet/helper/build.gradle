dependencies { implementation project(':core') }
tasks.register('standaloneJar', Jar) {
    archiveClassifier = 'standalone'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest { attributes 'Main-Class': 'dev.abros.rivet.helper.Main' }
    from sourceSets.main.output
    dependsOn ':core:classes', configurations.runtimeClasspath
    // The external updater only applies/reverts file transactions. Keep server,
    // map and UI classes out of its independent runtime. Include nested DTOs used by Gson.
    from(project(':core').sourceSets.main.output.classesDirs) {
        ['Hashes', 'Json', 'Planner', 'SafePaths', 'Transactions'].each { name ->
            include "dev/abros/rivet/core/${name}.class", "dev/abros/rivet/core/${name}\$*.class"
        }
    }
    from { configurations.runtimeClasspath.findAll { it.name.startsWith('gson-') }.collect { zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'module-info.class', 'META-INF/versions/**/module-info.class'
}

tasks.named('test') { dependsOn tasks.named('standaloneJar'); systemProperty 'rivet.helperJar', tasks.named('standaloneJar').get().archiveFile.get().asFile.absolutePath }
